# Example edge / reverse-proxy config for the Next.js monolith.
# Adjust upstream host/port for your deployment (no localhost in committed config).

upstream next_app {
    server next:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # All App Router traffic (including /api/*) is served by Next.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://next_app;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://next_app;
    }
}
