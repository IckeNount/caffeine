# Registry of API path prefixes for the Next.js App Router (src/app/api/**/route.ts).
# `npm run check:routes` ensures every API namespace in the app appears here and that
# each entry maps to at least one handler (no stale gateway rows).

prefixes:
  - path: /api/analyze
    auth: none
  - path: /api/daily-reading
    auth: none
  - path: /api/dictionary
    auth: none
  - path: /api/ocr
    auth: none
