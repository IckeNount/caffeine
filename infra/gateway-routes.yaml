# Registry of API path prefixes for the Next.js App Router (src/app/api/**/route.ts).
# `npm run check:routes` ensures every API namespace in the app appears here and that
# each entry maps to at least one handler (no stale gateway rows).

prefixes:
  - path: /api/admin
    auth: required
    notes: Teacher/admin APIs; middleware returns 401 without session.
  - path: /api/analyze
    auth: optional
  - path: /api/dictionary
    auth: optional
  - path: /api/lessons
    auth: optional
  - path: /api/ocr
    auth: optional
  - path: /api/transcription
    auth: optional
  - path: /api/transcriptions
    auth: optional
