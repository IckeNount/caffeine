name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholders so CI matches production env *names*; replace with GitHub Variables if you want real project URLs.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.ci-placeholder-anon-key-min-length
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.ci-placeholder-service-role-key-min-len
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment contract
        run: npm run check:env

      - name: Route inventory and gateway registry (nginx + gateway-routes.yaml)
        run: npm run check:routes

      - name: Run linter
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: API smoke tests
        run: |
          npm run start &
          echo $! > /tmp/next-smoke.pid
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/api/dictionary" || true)
            if [ "$code" = "400" ]; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3000 npm run smoke:api
          kill "$(cat /tmp/next-smoke.pid)" 2>/dev/null || true
          wait 2>/dev/null || true
